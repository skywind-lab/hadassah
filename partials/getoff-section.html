<section class="getoff-section">
  <div class="container getoff-section__container">
    <h2 class="getoff-section__title">Get 15% off your first order</h2>
    <p class="card-text-white getoff-section__text">
      Subscribe to our newsletter and be the first to know about new products
      and special offers
    </p>
    <form class="getoff-section__buttons">
      <input
        class="getoff-section__form"
        type="email"
        placeholder="Enter your e-mail"
        required
        class="newsletter__input"
      />
      <button class="button getoff-section__btn" type="submit">
        Subscribe
      </button>
    </form>
  </div>
</section>
