<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <!-- Styles -->
    <link rel="stylesheet" href="./scss/main.scss" />
  </head>
  <body>
    <!-- Heder -->
    <load src="./partials/header.html" />
    <!-- Burger -->
    <load src="./partials/mobile-menu.html" />
    <main>
      <!-- Hero -->
      <section class="section about-hero-section">
        <h1 class="pages-hero-title about-hero-section__title">
          Product Catalog
        </h1>
        <h3 class="pages-hero-subtitle">
          Discover the full range of HADASSAH cosmetics
        </h3>

        <div class="container catalog-hero-container">
          <div class="search-bar">
            <svg class="search-bar__icon" width="20" height="20">
              <use href="./images/icons.svg#icon-search"></use>
            </svg>
            <input
              class="search-bar__input"
              type="text"
              placeholder="Search products..."
            />
          </div>
        </div>
      </section>

      <!-- Catalog Section -->
      <section class="section catalog-section">
        <!-- Selection -->
        <div class="container catalog-section__selection">
          <div class="custom-select" id="sortSelect">
            <button type="button" class="custom-select__button">
              <span class="custom-select__value">Popular</span>
              <svg
                class="custom-select__arrow"
                width="12"
                height="8"
                viewBox="0 0 12 8"
                aria-hidden="true"
              >
                <path
                  d="M1 1.5L6 6.5L11 1.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  fill="none"
                  stroke-linecap="round"
                />
              </svg>
            </button>

            <ul class="custom-select__dropdown">
              <li class="custom-select__option is-active" data-value="popular">
                Popular
              </li>
              <li class="custom-select__option" data-value="price-asc">
                Price: Low to High
              </li>
              <li class="custom-select__option" data-value="price-desc">
                Price: High to Low
              </li>
              <li class="custom-select__option" data-value="newest">Newest</li>
            </ul>
          </div>
        </div>

        <!-- Layout -->
        <div class="container catalog-section__layout">
          <!-- Сайдбар с фильтрами (В WP это станет sidebar.php / WooCommerce Widgets) -->
          <aside class="sidebar">
            <div class="sidebar__filter-widget">
              <h5 class="sidebar__title">Categories</h5>
              <ul class="sidebar__categories">
                <li>
                  <a href="catalog.html?category=all">
                    All <span class="sidebar__count">(40)</span>
                  </a>
                </li>
                <li>
                  <a href="catalog.html?category=skincare">
                    Skincare <span class="sidebar__count">(10)</span>
                  </a>
                </li>
                <li>
                  <a href="catalog.html?category=makeup">
                    Makeup <span class="sidebar__count">(15)</span>
                  </a>
                </li>
                <li>
                  <a href="catalog.html?category=fragrances">
                    Fragrances <span class="sidebar__count">(8)</span>
                  </a>
                </li>
                <li>
                  <a href="catalog.html?category=new">
                    New Arrivals <span class="sidebar__count">(7)</span>
                  </a>
                </li>
              </ul>

              <h5 class="sidebar__title sidebar__price">Price Range</h5>
              <div class="price-range">
                <input
                  class="price-range__slider"
                  type="range"
                  id="range"
                  min="0"
                  max="150"
                  value="120"
                  step="1"
                />
              </div>
              <div class="price-range__labels">
                <span>€0</span>
                <span id="current-price">€150</span>
              </div>
            </div>
          </aside>

          <!-- Products -->
          <div class="catalog-section__main">
            <!-- Сетка товаров (Стандартная структура Woo: ul.products > li.product) -->

            <!-- новый -->
            <ul class="catalog-section__product-grid">
              <!-- Карточки подставятся сюда через JS -->
            </ul>

            <nav class="pagination" aria-label="Pagination">
              <ul class="pagination__list">
                <!-- Кнопки подставятся сюда через JS -->
              </ul>
            </nav>
          </div>
        </div>
      </section>
    </main>
    <!-- Footer -->
    <load src="./partials/footer.html" />

    <script src="js/mobile-menu.js"></script>
    <script src="js/custom-select.js"></script>

    <script src="js/catalog.js"></script>
    <script src="js/pagination.js"></script>
  </body>
</html>
